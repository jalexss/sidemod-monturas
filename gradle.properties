# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true

# Cobblemon 1.7.3 requires Java exactly 21 (not 22+).
# Prefer JAVA_HOME or ~/.gradle/gradle.properties for org.gradle.java.home (never commit absolute paths).

# IntelliJ IDEA is not yet fully compatible with configuration cache
org.gradle.configuration-cache=false

# Fabric / Minecraft (aligned with Cobblemon 1.7.3 MDK)
minecraft_version=1.21.1
loader_version=0.17.2

# Mod Properties
mod_version=1.0.0
maven_group=com.soleysus
archives_base_name=cobble_mounts

# Dependencies
fabric_api_version=0.116.6+1.21.1
# Must match Cobblemon 1.7.3 nested Fabric Language Kotlin
fabric_kotlin_version=1.13.6+kotlin.2.2.20
cobblemon_version=1.7.3+1.21.1

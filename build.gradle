plugins {
	id 'java'
	id 'dev.architectury.loom' version '1.11-SNAPSHOT'
	id 'architectury-plugin' version '3.4-SNAPSHOT'
	id 'org.jetbrains.kotlin.jvm' version '2.2.20'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

architectury {
	platformSetupLoomIde()
	fabric()
}

loom {
	silentMojangMappingsLicense()
	splitEnvironmentSourceSets()

	mods {
		"cobble_mounts" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	mixin {
		defaultRefmapName = "mixins.${project.archives_base_name}.refmap.json"
	}
}

repositories {
	// Official Cobblemon artefacts (same as Cobblemon MDK)
	maven {
		name = "Cobblemon"
		url = "https://artefacts.cobblemon.com/releases/"
	}
	mavenCentral()
}

dependencies {
	// Minecraft / Fabric — aligned with Cobblemon Fabric Java MDK
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Runtime full Fabric API; compile only the modules we need (MDK style)
	modRuntimeOnly "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	modImplementation fabricApi.module("fabric-command-api-v2", project.fabric_api_version)
	modImplementation fabricApi.module("fabric-lifecycle-events-v1", project.fabric_api_version)
	modImplementation fabricApi.module("fabric-key-binding-api-v1", project.fabric_api_version)
	modImplementation fabricApi.module("fabric-networking-api-v1", project.fabric_api_version)

	// Must match Cobblemon 1.7.3's Kotlin stack (also enables Kotlin metadata remapping)
	modImplementation "net.fabricmc:fabric-language-kotlin:${project.fabric_kotlin_version}"

	// Official Cobblemon Maven coords (same as Cobblemon MDK).
	// NEVER use files("libs/Cobblemon-....jar") in dev: that leaves intermediary
	// names (class_2960) inside Kotlin metadata and crashes the client.
	modCompileOnly("com.cobblemon:mod:${project.cobblemon_version}") {
		transitive = false
	}
	modImplementation "com.cobblemon:fabric:${project.cobblemon_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
	it.compilerOptions.jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21)
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.base.archivesName.get()
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_${projectName}" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	repositories {
	}
}
